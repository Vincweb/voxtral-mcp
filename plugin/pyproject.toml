[project]
name = "voxtral-mcp"
version = "0.1.1"
description = "MCP server wrapping Mistral Voxtral 4B TTS (via mlx-audio) for Claude Code on Apple Silicon"
requires-python = ">=3.10,<3.14"
dependencies = [
  "mcp>=1.0.0",
  "mlx-audio>=0.1",
  "mistral-common[audio]>=1.5",
  "numpy>=1.26",
  "soundfile>=0.12",
]

[project.scripts]
voxtral-mcp = "voxtral_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxtral_mcp"]
