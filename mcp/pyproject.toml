[project]
name = "voxtral-mcp"
version = "0.6.0"
description = "MCP server wrapping Mistral Voxtral 4B TTS (via mlx-audio) for Claude Code on Apple Silicon — in-process, streaming, gap-free playback"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vincent Caudron" }]
requires-python = ">=3.10,<3.14"
keywords = ["mcp", "tts", "voxtral", "mistral", "mlx", "claude", "claude-code", "voice", "speech", "apple-silicon"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "mcp>=2.0.0",
  "mlx-audio>=0.1",
  "mistral-common[audio]>=1.5",
  "numpy>=1.26",
  "sounddevice>=0.5",
]

[project.urls]
Homepage = "https://github.com/Vincweb/voxtral-mcp"
Repository = "https://github.com/Vincweb/voxtral-mcp"
Issues = "https://github.com/Vincweb/voxtral-mcp/issues"

[project.scripts]
voxtral-mcp = "voxtral_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxtral_mcp"]
